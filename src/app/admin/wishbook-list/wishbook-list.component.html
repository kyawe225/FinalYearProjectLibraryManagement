@if(receivedData() != ""){
	<ngb-alert type="success" [dismissible]="false">
		<span class="">{{receivedData()}}</span>
	</ngb-alert>
}


<table class="table table-striped my-3">
	<thead>
		<tr>
			<th scope="col">#</th>
			<th scope="col" sortable="name">Title</th>
			<th scope="col" sortable="name">UserName</th>
			<th scope="col" sortable="name">User Email</th>
			<th scope="col" sortable="area">Add Date</th>
			<th scope="col" sortable="area">Action</th>
		</tr>
	</thead>
	<tbody>
		@for (item of datasource(); track item.id) {
			<tr>
				<th scope="row">{{ item.id }}</th>
				<td>
					{{item.book.title}}
				</td>
                <td>
					{{item.user?.name}}
				</td>
                <td>
					{{item.user?.email}}
				</td>
				<td>{{ item.createdAt }}</td>
                <td>
                    <button class="btn btn-primary" (click)="clickUpdateTodo(item.id)">Update</button>
                    <button class="btn btn-danger" (click)="clickDeleteTodo(item.id)">Delete</button>
                </td>
			</tr>
		}
	</tbody>
</table>
