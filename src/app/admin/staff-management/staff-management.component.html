<div class="admin-container">
    <div class="admin-header">
      <h1>Staff Management</h1>
      <button class="add-button" mat-raised-button color="primary" (click)="onAddStaff()">
        <mat-icon>add</mat-icon> Add New Staff
      </button>
    </div>
  
    <div class="table-container">
      <app-common-material-table
        [displayedColumns]="displayedColumns"
        [dataSource]="dataSource"
        title="Staff Members"
        [showFilter]="true"
        [showPaginator]="true"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50, 100]"
        [actionsColumn]="true"
        [loading]="loading"
        emptyStateMessage="No staff members found"
        (rowClick)="onViewStaff($event)"
        (editClick)="onEditStaff($event)"
        (deleteClick)="onDeleteStaff($event)"
        (viewClick)="onViewStaff($event)"
        (refresh)="onRefresh()">
      </app-common-material-table>
    </div>
  </div>
