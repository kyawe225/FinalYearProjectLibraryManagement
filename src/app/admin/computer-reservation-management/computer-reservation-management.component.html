<!-- src/app/admin/computer-reservations/computer-reservation-management.component.html -->

<div class="computer-reservation-container">
    <mat-card class="header-card">
      <mat-card-header>
        <mat-card-title>Computer Reservation Management</mat-card-title>
        <mat-card-subtitle>Manage computer reservations and appointments</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="filter-container">
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="picker" [value]="selectedDate()" 
                   (dateChange)="selectedDate.set($event.value.toISOString().split('T')[0]); onFilterChange()">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Branch</mat-label>
            <mat-select [value]="selectedBranch()" (selectionChange)="selectedBranch.set($event.value); onFilterChange()">
              <mat-option value="">All Branches</mat-option>
              <mat-option *ngFor="let branch of branches()" [value]="branch.id">
                {{ branch.branch_name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Status</mat-label>
            <mat-select [value]="selectedStatus()" (selectionChange)="selectedStatus.set($event.value); onFilterChange()">
              <mat-option value="">All Statuses</mat-option>
              <mat-option *ngFor="let status of statuses()" [value]="status">
                {{ status }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-raised-button color="primary" (click)="handleAddClick()">
          <mat-icon>add</mat-icon> Add Reservation
        </button>
      </mat-card-actions>
    </mat-card>
  
    <div class="table-container">
      <app-common-material-table
        [displayedColumns]="displayedColumns()"
        [dataSource]="dataSource()"
        [title]="'Computer Reservations'"
        [showFilter]="true"
        [showPaginator]="true"
        [pageSize]="10"
        [loading]="loading()"
        [actionsColumn]="true"
        [emptyStateMessage]="'No reservations found for the selected filters'"
        (rowClick)="handleRowClick($event)"
        (editClick)="handleEditClick($event)"
        (deleteClick)="handleDeleteClick($event)"
        (refresh)="handleRefresh()">
        
        <!-- Custom column templates -->
        <ng-template #statusColumnTemplate let-element>
          <div class="status-chip-container">
            <span [ngClass]="['status-chip', getStatusClass(element.status)]">
              {{ element.status }}
            </span>
            
            <!-- Quick status change menu - not visible in view mode -->
            <button mat-icon-button [matMenuTriggerFor]="statusMenu" (click)="$event.stopPropagation()">
              <mat-icon>more_vert</mat-icon>
            </button>
            
            <mat-menu #statusMenu="matMenu">
              <button mat-menu-item *ngFor="let status of statuses()" 
                      (click)="handleStatusChange(element, status)" 
                      [disabled]="element.status === status">
                {{ status }}
              </button>
            </mat-menu>
          </div>
        </ng-template>
        
        <ng-template #time_slotColumnTemplate let-element>
          {{ formatTimeSlot(element.start_time, element.end_time) }}
        </ng-template>
      </app-common-material-table>
    </div>
  </div>
