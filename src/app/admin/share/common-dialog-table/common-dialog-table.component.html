<!-- shared/components/crud-dialog/crud-dialog.component.html -->
<div class="dialog-container">
  <h2 mat-dialog-title>{{dialogTitle}}</h2>
  
  <div *ngIf="isDeleteDialog" class="delete-container">
    <p class="delete-message">Are you sure you want to delete this item? This action cannot be undone.</p>
    <div mat-dialog-actions class="dialog-actions" align="end">
      <button mat-button (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="warn" (click)="onDelete()">Delete</button>
    </div>
  </div>
  
  <form *ngIf="!isDeleteDialog" [formGroup]="dialogForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
      <div class="form-fields">
        <ng-container *ngFor="let field of formFields">
          <!-- Special handling for checkboxes which don't need a mat-form-field wrapper -->
          <ng-container *ngIf="field.type === 'checkbox'; else standardField">
            <div class="checkbox-container">
              <mat-checkbox [formControlName]="field.name" color="primary">
                {{field.label}}
              </mat-checkbox>
            </div>
          </ng-container>
          
          <ng-template #standardField>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>{{field.label}}</mat-label>
              
              <ng-container [ngSwitch]="field.type">
                <!-- Text input -->
                <input *ngSwitchCase="'text'" matInput [formControlName]="field.name">
                
                <!-- Email input -->
                <input *ngSwitchCase="'email'" type="email" matInput [formControlName]="field.name">
                
                <!-- Password input -->
                <input *ngSwitchCase="'password'" type="password" matInput [formControlName]="field.name">
                
                <!-- Number input -->
                <input *ngSwitchCase="'number'" type="number" matInput [formControlName]="field.name"
                       [min]="field.min || 0" [max]="field.max || 0">
                
                <!-- Date input -->
                <input *ngSwitchCase="'date'" matInput [matDatepicker]="picker" [formControlName]="field.name">
                <mat-datepicker-toggle *ngSwitchCase="'date'" matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
                
                <!-- Time input -->
                <input *ngSwitchCase="'time'" type="time" matInput [formControlName]="field.name">
                
                <!-- Time picker with Angular Material -->
                <ng-container *ngSwitchCase="'timepicker'">
                  <mat-select [formControlName]="field.name">
                    <mat-option *ngFor="let time of generateTimeOptions()" [value]="time.value">
                      {{time.label}}
                    </mat-option>
                  </mat-select>
                </ng-container>
                
                <!-- Select input -->
                <mat-select *ngSwitchCase="'select'" [formControlName]="field.name">
                  <mat-option *ngFor="let option of field.options" [value]="option.value">
                    {{option.label}}
                  </mat-option>
                </mat-select>
                
                <!-- Textarea input -->
                <textarea *ngSwitchCase="'textarea'" matInput [formControlName]="field.name" rows="4"></textarea>
                
                <!-- Default text input -->
                <input *ngSwitchDefault matInput [formControlName]="field.name">
              </ng-container>
              
              <!-- Error messages -->
              <mat-error *ngIf="dialogForm.get(field.name)?.invalid && dialogForm.get(field.name)?.touched">
                {{getErrorMessage(field)}}
              </mat-error>
            </mat-form-field>
          </ng-template>
        </ng-container>
      </div>
    </div>
    
    <div mat-dialog-actions class="dialog-actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button *ngIf="!isReadOnly" mat-raised-button color="primary" type="submit" [disabled]="dialogForm.invalid">
        {{submitButtonText}}
      </button>
      <button *ngIf="isReadOnly" mat-raised-button color="primary" type="button" (click)="onCancel()">
        Close
      </button>
    </div>
  </form>
</div>
