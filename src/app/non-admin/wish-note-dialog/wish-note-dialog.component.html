<h2 mat-dialog-title>Edit Notes</h2>
<div mat-dialog-content>
  <p class="book-title">{{ data.bookTitle }}</p>
  
  <mat-form-field appearance="outline" class="notes-field">
    <mat-label>Notes</mat-label>
    <textarea matInput 
      [formControl]="notesControl" 
      placeholder="Add your notes about this book..." 
      rows="4"></textarea>
    <mat-hint align="end">{{ notesControl.value?.length || 0 }}/500</mat-hint>
    <mat-error *ngIf="notesControl.hasError('maxlength')">
      Notes cannot exceed 500 characters
    </mat-error>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button 
    color="primary" 
    (click)="onSave()" 
    [disabled]="notesControl.invalid">
    Save
  </button>
</div>
