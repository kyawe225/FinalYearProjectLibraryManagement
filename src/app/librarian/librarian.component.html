<div class="app-container">
  <!-- Header -->
  <mat-toolbar color="primary" class="app-header">
    <button
      mat-icon-button
      (click)="toggleSidebar()"
      class="hamburger-btn"
      aria-label="Toggle sidebar menu">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="logo-container">
      <img src="assets/images/library-logo.png" alt="Library Logo" class="header-logo" />
      <span class="header-title">University Library</span>
    </div>

    <span class="spacer"></span>

    <div class="header-actions">
      <button mat-icon-button aria-label="Search">
        <mat-icon>search</mat-icon>
      </button>
      
      <button mat-icon-button aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>account_circle</mat-icon>
        <span class="username">Admin</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>exit_to_app</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>
  
  <!-- Main Content Container with Sidebar and Content Area -->
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidebar -->
    <mat-sidenav 
      #sidenav 
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="isOpen" 
      [disableClose]="!isMobile()"
      fixedInViewport="true"
      [fixedTopGap]="isMobile() ? 56 : 64"
      class="sidenav">
      
      <div class="sidebar-container" [class.sidebar-expanded]="isOpen" [class.sidebar-collapsed]="!isOpen">
        <mat-nav-list class="sidebar-nav">
          <ng-container *ngFor="let item of menuItems()">
            <!-- Menu item without children -->
            <a mat-list-item 
               *ngIf="!item.children"
               [routerLink]="item.route" 
               routerLinkActive="active-link"
               (click)="closeSidebarOnMobile()"
               class="menu-item">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="menu-title" *ngIf="isOpen">{{ item.title }}</span>
            </a>

            <!-- Menu item with children -->
            <div *ngIf="item.children" class="parent-menu-item">
              <a mat-list-item (click)="toggleSubMenu(item, $event)" class="menu-item">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span class="menu-title" *ngIf="isOpen">{{ item.title }}</span>
                <span class="spacer"></span>
                <mat-icon *ngIf="isOpen" class="menu-expand-icon">
                  {{ item.expanded ? 'expand_less' : 'expand_more' }}
                </mat-icon>
              </a>

              <!-- Submenu items -->
              <div class="submenu" [class.expanded]="item.expanded && isOpen">
                <a mat-list-item 
                   *ngFor="let child of item.children"
                   [routerLink]="child.route" 
                   routerLinkActive="active-link"
                   (click)="closeSidebarOnMobile()"
                   class="submenu-item">
                  <mat-icon>{{ child.icon }}</mat-icon>
                  <span class="menu-title" *ngIf="isOpen">{{ child.title }}</span>
                </a>
              </div>
            </div>
          </ng-container>
        </mat-nav-list>
      </div>
    </mat-sidenav>
    
    <!-- Main content area -->
    <mat-sidenav-content [ngClass]="{'content-shifted': isOpen && !isMobile()}">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
